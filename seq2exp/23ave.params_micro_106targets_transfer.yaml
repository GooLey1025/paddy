transfer:
  mode: full

train:
  batch_size: 64
  shuffle_buffer: 256
  optimizer: adam
  learning_rate: 0.0002
  loss: poisson_mn # for 2d_to_1d, which is poisson loss
  total_weight: 0.2
  weight_range: 8
  weight_exp: 6
  warmup_steps: 1000
  global_clipnorm: 0.2
  adam_beta1: 0.9
  adam_beta2: 0.999
  patience: 30
  train_epochs_min: 100
  train_epochs_max: 10000
  num_gpu: 1
model:
  model_type: 2d_to_1d # Note this
  seq_length: 32768
  seq_depth: 4
  target_length: 1
  augment_rc: true
  augment_shift: 3
  activation: gelu
  norm_type: batch
  bn_momentum: 0.9
  kernel_initializer: lecun_normal
  l2_scale: 1.0e-06
  trunk:
  - name: conv_dna
    filters: 128
    kernel_size: 11
    norm_type: null
    activation: linear
    pool_size: 2
  - name: res_tower
    filters_init: 160
    filters_end: 320
    divisible_by: 8
    kernel_size: 5
    num_convs: 1
    pool_size: 2
    repeat: 6
  - name: transformer_tower
    key_size: 32
    heads: 4
    num_position_features: 32
    dropout: 0.1
    attention_dropout: 0.01
    mha_l2_scale: 1.0e-08
    l2_scale: 1.0e-08
    kernel_initializer: he_normal
    repeat: 4
  - name: unet_conv
    kernel_size: 3
  - name: unet_conv
    kernel_size: 3
  head_rice_gene_expression:
  - name: "global_pool"
    pool_type: "attention"
    pool_axis: 1
  - name: "final"
    units: 23
    activation: softplus

